name: Docker Image Attestation
description: Create Docker image provenance attestations, publish digests to step summary, and optionally update release notes
author: Schemacrawler
inputs:
  image-name:
    description: Fully qualified Docker image name (e.g., index.docker.io/schemacrawler/schemacrawler)
    required: true
  digest:
    description: Multi-platform image digest output from a push operation
    required: true
  publishing-repo:
    description: GitHub repository path for release notes updates (e.g., schemacrawler/SchemaCrawler)
    required: true
  tag-name:
    description: GitHub release tag name for release notes updates
    required: true
  update-release:
    description: Boolean indicating whether to update GitHub release notes (true/false)
    required: true
outputs:
  image-digest:
    description: The image digest value
    value: ${{ inputs.digest }}
  immutable-ref:
    description: The full immutable image reference (image@digest)
    value: ${{ steps.publish-summary.outputs.immutable-ref }}
  attestation-outcome:
    description: The outcome of the attestation step (success/failure)
    value: ${{ steps.attest.outcome }}
  attestation-url:
    description: URL to the published attestation (if successful)
    value: ${{ steps.attest.outputs.attestation-url }}
runs:
  using: composite
  steps:
    - name: Create Docker image attestation
      id: attest
      continue-on-error: true
      uses: actions/attest@v4
      with:
        subject-name: ${{ inputs.image-name }}
        subject-digest: ${{ inputs.digest }}

    - name: Publish digest and attestation status to step summary
      id: publish-summary
      shell: bash
      env:
        DIGEST: ${{ inputs.digest }}
        IMAGE_NAME: ${{ inputs.image-name }}
        ATTESTATION_OUTCOME: ${{ steps.attest.outcome }}
        ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
      run: |
        set -e

        IMMUTABLE_REF="${IMAGE_NAME}@${DIGEST}"

        {
          echo "## Docker Image Attestation"
          echo ""
          echo "**Image Digest:** \`${DIGEST}\`"
          echo ""
          echo "**Immutable Reference:** \`${IMMUTABLE_REF}\`"
          echo ""
          if [ "${ATTESTATION_OUTCOME}" = "success" ]; then
            echo "**Attestation Status:** ✓ Success"
            echo ""
            if [ -n "${ATTESTATION_URL}" ]; then
              echo "[View attestation](${ATTESTATION_URL})"
            fi
          else
            echo "**Attestation Status:** ✗ Failed (workflow continues)"
          fi
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

        echo "immutable-ref=${IMMUTABLE_REF}" >> "$GITHUB_OUTPUT"

    - name: Update GitHub release notes with image metadata
      id: update-release
      if: ${{ inputs.update-release == 'true' }}
      shell: bash
      continue-on-error: true
      env:
        TAG_NAME: ${{ inputs.tag-name }}
        DIGEST: ${{ inputs.digest }}
        IMAGE_NAME: ${{ inputs.image-name }}
        PUBLISHING_REPO: ${{ inputs.publishing-repo }}
        ATTESTATION_OUTCOME: ${{ steps.attest.outcome }}
        ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        WORK_DIR="$(mktemp -d)"
        trap 'rm -rf "$WORK_DIR"' EXIT
        export WORK_DIR

        if ! gh release view "${TAG_NAME}" \
          --repo "${PUBLISHING_REPO}" \
          --json body > "${WORK_DIR}/release.json"; then
          echo "::warning::Unable to retrieve release; notes were not updated."
          exit 1
        fi

        python3 <<'PYTHON_EOF'
        import json
        import os
        import re
        from pathlib import Path

        work_dir = Path(os.environ["WORK_DIR"])
        release = json.loads(
            (work_dir / "release.json").read_text(encoding="utf-8")
        )
        body = release.get("body") or ""

        image = os.environ["IMAGE_NAME"]
        digest = os.environ["DIGEST"]
        outcome = os.environ["ATTESTATION_OUTCOME"]
        url = os.environ.get("ATTESTATION_URL", "")

        start = "<!-- docker-image-provenance:start -->"
        end = "<!-- docker-image-provenance:end -->"

        lines = [
            start,
            "## Docker Image Provenance",
            "",
            f"**Image Reference:** `{image}@{digest}`",
            "",
            f"**Digest:** `{digest}`",
            "",
        ]

        if outcome == "success":
            lines.append(
                "**Attestation Status:** Signed provenance available"
            )
            if url:
                lines.extend(["", f"[View attestation]({url})"])
        else:
            lines.append(
                "**Attestation Status:** Attestation was not completed "
                "for this image"
            )

        lines.append(end)
        new_section = "\n".join(lines)

        if body.count(start) != body.count(end) or body.count(start) > 1:
            raise SystemExit(
                "Unexpected provenance markers; refusing to modify notes."
            )

        if start in body:
            pattern = re.escape(start) + r".*?" + re.escape(end)
            updated, count = re.subn(
                pattern,
                lambda match: new_section,
                body,
                count=1,
                flags=re.DOTALL,
            )
            if count != 1:
                raise SystemExit(
                    "Invalid provenance marker order; notes unchanged."
                )
        elif body:
            updated = new_section + "\n\n" + body
        else:
            updated = new_section + "\n"

        (work_dir / "updated-notes.md").write_text(
            updated,
            encoding="utf-8",
        )
        PYTHON_EOF

        gh release edit "${TAG_NAME}" \
          --repo "${PUBLISHING_REPO}" \
          --notes-file "${WORK_DIR}/updated-notes.md"
